<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma carte</title>
<style>
:root{--gold:#e9c46a;--gold2:#c9972b;--ink:#0d0b08}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--ink);color:#fff}
.page{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;
  background:url('bg.jpg') center top/cover no-repeat}
.page::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,0) 35%,rgba(10,8,5,.75) 62%,rgba(10,8,5,.96) 100%)}
.card{position:relative;padding:0 22px 28px;max-width:480px;width:100%;margin:0 auto}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--gold);font-weight:600;margin:4px 0 20px;font-size:15px}
.btns{display:grid;gap:10px}
.btn{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;text-decoration:none;font-weight:700;font-size:16px;
  background:rgba(255,255,255,.08);border:1px solid rgba(233,196,106,.45);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.main{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1306;border:0}
.btn svg{width:22px;height:22px;flex:none}
.foot{text-align:center;color:rgba(255,255,255,.4);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main class="page">
  <div class="card">
    <div class="btns">
      <a class="btn main" href="tel:+212666218367">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
        Appeler</a>
      <a class="btn" href="https://wa.me/212666218367">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6 0l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg>
        WhatsApp</a>
      <a class="btn" href="https://maps.google.com/?q=Maroc">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        Localisation</a>
      <a class="btn" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        Visiter</a>
    </div>
    <p class="foot">Approchez · Scannez · Connectez</p>
  </div>
</main>
</body>
</html>
